<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DocVerify AI</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="brand">DocVerify AI</header>

  <main>
    <section class="card" id="login-panel">
      <h1>Sign in</h1>
      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button id="submit-button" type="submit">Sign in</button>
        <p id="login-message" role="status"></p>
      </form>
    </section>

    <section class="card" id="account-panel" hidden>
      <h1 id="account-heading" tabindex="-1">Your account</h1>
      <dl>
        <dt>Email address</dt>
        <dd id="account-email"></dd>
        <dt>Role</dt>
        <dd id="account-role"></dd>
      </dl>
      <section id="applicant-documents" hidden>
  <h2>My documents</h2>
  <ul id="document-list" aria-label="Your documents"></ul>
  <p id="list-message" role="status"></p>

  <form id="upload-form">
    <label for="pdf-file">Upload a PDF</label>
    <input id="pdf-file" type="file" accept=".pdf,application/pdf"
           aria-describedby="file-hint" required>
    <small id="file-hint">Maximum file size: 5 MiB.</small>
    <button id="upload-button" type="submit">Upload document</button>
    <p id="upload-message" role="status"></p>
  </form>
</section>
<section id="reviewer-panel" hidden>
  <h2>Pending reviews</h2>
  <ul id="review-queue" aria-label="Documents awaiting review"></ul>
  <p id="review-message" role="status"></p>
</section>
<button type="button" id="switch-account">Log out</button>

    </section>
  </main>
</body>
</html>
