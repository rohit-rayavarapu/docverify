name: Phase 2 CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and lint tools
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install ruff==0.11.13

      - name: Check Python style and errors
        run: ruff check --select E4,E7,E9,F backend/app backend/tests

      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Build images and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verify vector database
        run: |
          result=$(docker compose exec -T vector-db psql -U docverify -d vectors -Atc "SELECT '[1,2]'::vector <-> '[1,2]'::vector")
          test "$result" = 0

      - name: Test registration, login and document listing through the frontend proxy
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080/api
          curl --retry 12 --retry-all-errors --retry-delay 2 -fsS "$base/health/db" > /dev/null
          account='{"email":"phase2-ci@example.com","password":"Disposable-ci-password-123"}'
          registration=$(jq -c '. + {full_name:"CI Applicant"}' <<< "$account")
          curl -fsS --json "$registration" "$base/register" | jq -e '.role == "Applicant"'
          token=$(curl -fsS --json "$account" "$base/login" | jq -er '.access_token')
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" "$base/me" | jq -e '.email == "phase2-ci@example.com"'
          curl -fsS -H "$auth" "$base/documents" | jq -e '. == []'

      - name: Show container status on failure
        if: failure()
        run: docker compose ps -a

      - name: Stop disposable CI stack
        if: always()
        run: docker compose down --volumes
