server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/documents/batch {
        client_max_body_size 51m;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}